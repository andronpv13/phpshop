<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Корзина | PHPShop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><div class="container header-inner">
    <a href="index.html" class="logo">🛒 PHPShop 6.6.5</a>
    <nav class="nav"><a href="index.html">Каталог</a><a href="cart.html" style="color:var(--primary)">Корзина <span id="cart-count"></span></a></nav>
  </div></header>
  <main class="container">
    <h1 style="margin:24px 0;">Ваша корзина</h1>
    <table class="table" id="cart-table">
      <thead><tr><th>Товар</th><th>Кол-во</th><th>Цена</th><th>Сумма</th><th></th></tr></thead>
      <tbody id="cart-items"><tr><td colspan="5">Корзина пуста</td></tr></tbody>
    </table>
    <div class="cart-summary">
      <div class="row"><span>Товары</span><span id="cart-total">0 ₽</span></div>
      <div class="row total"><span>Итого</span><span id="cart-total">0 ₽</span></div>
      <a href="checkout.html" class="btn btn-success" style="margin-top:16px">Оформить заказ →</a>
    </div>
  </main>
  <script src="js/main.js"></script>
</body>
</html>
