<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Карточка товара | PHPShop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><div class="container header-inner">
    <a href="index.html" class="logo">🛒 PHPShop 6.6.5</a>
    <nav class="nav"><a href="index.html">Каталог</a><a href="cart.html">Корзина <span id="cart-count"></span></a></nav>
  </div></header>
  <main class="container">
    <div class="product-detail">
      <div class="product-img">📦 Крупное фото товара</div>
      <div class="product-meta">
        <h1>Смартфон Alpha X</h1>
        <div class="price">24 990 ₽</div>

        <button class="btn" data-add-to-cart data-id="101" data-name="Смартфон Alpha X" data-price="24990">🛒 Добавить в корзину</button>
        <p style="margin-top:12px; font-size:0.9rem; color:var(--text-muted)">Артикул: ALX-2026 | Наличие: ✅ На складе</p>
      </div>
    </div>
  </main>
  <script src="js/main.js"></script>
</body>
</html>
